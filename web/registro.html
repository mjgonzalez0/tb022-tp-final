<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro</title>
    <meta name="description" content="Una plataforma para compartir snippets de código.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Registro">
    <meta property="og:description" content="Una plataforma para compartir snippets de código.">
    <meta name="theme-color" content="#f02d65">
    <meta property="og:image" content="/assets/og_image.png">
    <link rel="icon" href="/assets/favicon.ico" />
    
    <link rel="stylesheet" href="https://unpkg.com/@appwrite.io/pink" />
    <link rel="stylesheet" href="https://unpkg.com/@appwrite.io/pink-icons" />
    <link rel="stylesheet" href="./css/registro.css">
        
    <script type="module" src="https://unpkg.com/@moaqzdev/toast"></script>
</head>
<body class="theme-dark">

    <article class="card">
        <form id="formulario"  class="form u-width-full-line u-max-width-500" novalidate>
            <h3 class="heading-level-3 u-text-center" >Crear Cuenta</h3>
            <br>
            <ul class="form-list">
                <li class="form-item">
                    <label class="label" for="correo">Correo electrónico</label>
                    <div  class="input-text-wrapper">
                        <input 
                        id="correo"
                        type="email" 
                        class="input-text" 
                        name="correo" 
                        maxlength="255"
                        placeholder="Ejemplo@gmail.com" 
                        required>
                        <p id="textCorreo" class="MensajeError"></p>
                    </div>
                </li>
                <li class="form-item">
                    <label class="label" for="usuario">Usuario</label>
                    <div  class="input-text-wrapper">
                        <input 
                        id="usuario"
                        type="text" 
                        class="input-text" 
                        name="nombre" 
                        minlength="3"
                        maxlength="60"
                        placeholder="Nombre de usuario " 
                        required>
                        <p id="textUsuario" class="MensajeError"></p>
                    </div>
                </li>
                <li class="form-item ">
                    <label class="label" for="contraseña">Contraseña</label>
                    <div  class="input-text-wrapper">
                        <input 
                        type="password" 
                        class="input-text" 
                        name="contraseña" 
                        id="contraseña"
                        minlength="8"
                        placeholder="Debe contener más de 8 carácteres" 
                        required>
                        <p id="mensajeContraseña" class="MensajeError"></p>
                    </div>
                </li>
                <li class="form-item ">
                    <label class="label" for="confirmarcontraseña">Confirmación de contraseña</label>
                    <div  class="input-text-wrapper">
                        <input 
                        type="password" 
                        class="input-text" 
                        name="confirmarcontraseña" 
                        id="confirmarcontraseña"
                        minlength="8"
                        placeholder="Repetir Contraseña" 
                        required>
                        <p id="mensajeRepContraseña" class="MensajeError"></p>
                    </div>
                </li>
            </ul>
            <br>
            <div class="u-flex u-main-center u-gap-12" >
                <button class="button" id="botonRegistro" type="submit">Registrarse</button>
            </div>
            <div class="u-flex u-main-center u-gap-12">
                <button id="botonLogin" class="button is-text" type="button" aria-label="Add new item">
                    <span class="text">¿Ya tienes una cuenta?</span>
                </button>
            </div>

            <p id="mensajeBotonRegistro" class="MensajeError">
            </p>  
        </form>
    </article>
    <div>
        <button id="boton-tema" class="button is-secondary" type="button" aria-label="Add new item">
            <span class="text icon-sun "></span>
        </button>
        <button id="boton-atras" class="button is-secondary" type="button" aria-label="Add new item">
            <span class="text icon-home ">Inicio</span>
        </button>
        
    </div> 

    <moaqz-toaster duration="8000" dismissable></moaqz-toaster>
    <script type="module" src="./js/registro.js"> </script>
</body>

</html>
